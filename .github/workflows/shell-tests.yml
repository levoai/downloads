name: Shell runner tests

# Lints and tests the Bitbucket and ShadowNet shell runners. Runs on changes to a
# runner script or its tests so the PR gets automated checks.
on:
  push:
    paths:
      - 'bitbucket/**.sh'
      - 'shadownet/**.sh'
      - '.github/workflows/shell-tests.yml'
  pull_request:
    paths:
      - 'bitbucket/**.sh'
      - 'shadownet/**.sh'
      - '.github/workflows/shell-tests.yml'

jobs:
  shellcheck-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint (shellcheck)
        # --severity=warning keeps results stable across shellcheck versions
        # (info-level style notes vary between releases); real issues still fail.
        run: |
          shellcheck --severity=warning bitbucket/levo-cli-runner.sh
          shellcheck --severity=warning bitbucket/tests/run_tests.sh
          shellcheck --severity=warning shadownet/shadownet-runner.sh
          shellcheck --severity=warning shadownet/tests/run_tests.sh

      - name: Syntax check
        run: |
          bash -n bitbucket/levo-cli-runner.sh
          bash -n shadownet/shadownet-runner.sh

      - name: Run tests (bitbucket runner)
        run: bitbucket/tests/run_tests.sh

      - name: Run tests (shadownet runner)
        run: shadownet/tests/run_tests.sh
