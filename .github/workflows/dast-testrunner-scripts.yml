name: DAST + test runner scripts

on:
  push:
    paths:
      - 'dast-and-testrunner/**'
      - '.github/workflows/dast-testrunner-scripts.yml'
  pull_request:
    paths:
      - 'dast-and-testrunner/**'
      - '.github/workflows/dast-testrunner-scripts.yml'

jobs:
  unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: shellcheck --severity=warning dast-and-testrunner/*.sh

      - name: Syntax check
        run: for f in dast-and-testrunner/*.sh; do bash -n "$f"; done

      - name: Compose file is valid
        working-directory: dast-and-testrunner
        env:
          LEVOAI_AUTH_KEY: dummy
          LEVOAI_ORG_ID: dummy
          COMPOSE_PROFILES: dast,api-testing,scheduled
        run: docker compose config --quiet

      - name: Compose refuses to start without credentials
        working-directory: dast-and-testrunner
        env:
          COMPOSE_PROFILES: dast
        run: |
          if docker compose config --quiet 2>/dev/null; then
            echo "compose accepted a missing LEVOAI_AUTH_KEY"; exit 1
          fi

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path dast-and-testrunner -Recurse -Settings dast-and-testrunner/PSScriptAnalyzerSettings.psd1
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }

      - name: Parse every script (Windows PowerShell 5.1 and PowerShell 7)
        run: |
          $files = Get-ChildItem dast-and-testrunner -Filter *.ps1
          foreach ($f in $files) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs; exit 1 }
          }
        shell: powershell
